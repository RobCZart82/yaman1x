name: ROM-free CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
          - windows-2025

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Run ROM-free checks
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Check multiply/divide under UBSan and verify original overflow control
        if: matrix.os == 'ubuntu-24.04'
        run: |
          cmake -S . -B build-ubsan -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-fsanitize=undefined -fno-sanitize-recover=all"
          cmake --build build-ubsan --target yamanix_h8_word_multiply_check yamanix_h8_signed_multiply_check yamanix_h8_byte_divide_check yamanix_h8_word_divide_check --parallel 2
          ctest --test-dir build-ubsan --output-on-failure -R '^yamanix_h8_((word|signed)_multiply|(byte|word)_divide)$'
          python tools/check_h8_word_multiply_ubsan.py build-ubsan/yamanix_h8_word_multiply_check
