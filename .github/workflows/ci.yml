name: ROM-free CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.check_name || matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
        include:
          # Required ruleset context retains its historical name;actual runner is15.
          - os: macos-15
            check_name: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Run ROM-free checks
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Check arithmetic under UBSan and verify original overflow control
        if: matrix.os == 'ubuntu-24.04'
        run: |
          cmake -S . -B build-ubsan -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-fsanitize=undefined -fno-sanitize-recover=all"
          cmake --build build-ubsan --target yamanix_an1x_syscr_check yamanix_h83002_syscr_modes_check yamanix_h8_word_multiply_check yamanix_h8_signed_multiply_check yamanix_h8_byte_divide_check yamanix_h8_word_divide_check yamanix_h8_decimal_adjust_check yamanix_h8_signed_byte_divide_check yamanix_h8_signed_word_divide_check yamanix_h8_displacement32_check yamanix_h8_ccr_memory_check yamanix_h8_long_displacement32_check yamanix_h8_ccr_absolute_check yamanix_h8_ccr_autoindex_check yamanix_h8_ccr_displacement16_check yamanix_h8_ccr_displacement32_check yamanix_h8_peripheral_moves_check yamanix_h8_eepmov_check yamanix_h8_sleep_check yamanix_an1x_memory_map_check yamanix_an1x_sci_bus_check yamanix_an1x_gpio4_check yamanix_an1x_gpio6_check yamanix_an1x_gpio8_check yamanix_an1x_gpio7_check yamanix_an1x_gpio9_check yamanix_an1x_gpioa_check yamanix_an1x_gpiob_check yamanix_an1x_gpio_word_check yamanix_an1x_irq_mmio_check --parallel 2
          ctest --test-dir build-ubsan --output-on-failure -R '^yamanix_h8_((word|signed)_multiply|(byte|word)_divide|signed_(byte|word)_divide|decimal_adjust|displacement32|long_displacement32|ccr_memory|ccr_absolute|ccr_autoindex|ccr_displacement16|ccr_displacement32|peripheral_moves|eepmov|sleep)$'
          ctest --test-dir build-ubsan --output-on-failure -R '^yamanix_an1x_(memory_map|sci_bus|gpio4|gpio6|gpio8|gpio7|gpio9|gpioa|gpiob|gpio_word|irq_mmio)$'
          ctest --test-dir build-ubsan --output-on-failure -R '^yamanix_(h83002_syscr_modes|an1x_syscr)$'
          python tools/check_h8_word_multiply_ubsan.py build-ubsan/yamanix_h8_word_multiply_check
